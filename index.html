<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루 10분 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4F1FB; --ink:#3D3A54; --accent:#8B7BC6; --accent2:#5FA8A0; --card:#ffffff; --line:#E4DDF5; }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body { margin:0; font-family:'Noto Sans KR',-apple-system,sans-serif; background:var(--bg); color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 16px 40px; }
  h1 { font-family:'Gowun Dodum',sans-serif; font-weight:400; font-size:1.55rem; letter-spacing:.01em; margin:8px 0 4px; }
  #topic { font-family:'Gowun Dodum',sans-serif; font-size:1.3rem; color:var(--accent); margin:0 0 20px; text-align:center; }
  #bubble { width:100%; max-width:640px; min-height:170px; background:var(--card); border-radius:26px; padding:26px 24px;
            font-size:1.55rem; font-weight:500; letter-spacing:.005em; line-height:1.68; color:var(--ink);
            box-shadow:0 4px 18px rgba(90,70,150,.12); border:1px solid var(--line); }
  #hint { font-family:'Gowun Batang',serif; font-size:1.05rem; font-style:italic; color:#8b84a8; line-height:1.7; }
  #me { width:100%; max-width:640px; min-height:2.4em; margin-top:12px; padding:8px 14px; font-size:1.2rem; color:#6d6690; text-align:center; }
  #status { font-family:'Gowun Dodum',sans-serif; font-size:1.25rem; margin:14px 0; min-height:1.8em; text-align:center; color:#6d6690; }
  button { font-family:'Gowun Dodum',sans-serif; border:0; border-radius:20px; color:#fff; cursor:pointer; }
  #main { width:100%; max-width:640px; padding:26px; font-size:1.9rem; letter-spacing:.02em; border-radius:999px;
          background:linear-gradient(135deg,var(--accent),#6F9CC9); }
  #main.listening { background:var(--accent2); }
  #main:disabled { background:#c6c0da; }
  #end { margin-top:22px; padding:14px 26px; font-size:1.15rem; background:#847b9e; }
  #bar { width:100%; max-width:640px; height:8px; background:var(--line); border-radius:8px; margin-top:18px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--accent2); transition:width 1s linear; }
</style>
</head>
<body>
<h1>💬 하루 10분 이야기</h1>
<p id="topic">불러오는 중…</p>
<div id="bubble"><span id="hint">대화 시작하기를 누른 후, "안녕~" 이라고 말하면서 시작해주세요.</span></div>
<div id="me"></div>
<div id="status"></div>
<button id="main">🎤 대화 시작하기</button>
<div id="bar"><i></i></div>
<button id="end" hidden>오늘은 여기까지 할게요</button>

<script>
// ▼▼▼ 설정 ▼▼▼ Apps Script 웹앱 배포 URL을 붙여넣으세요
const API = 'https://script.google.com/macros/s/AKfycbx-yOchb1muuHCJQnq2It6HxNCXxvRqRstIfaRLWeBe1RkJz6-TZA_vp5wdv8sM0H-1/exec';
// ▲▲▲▲▲▲▲▲▲▲▲
const KEY = new URLSearchParams(location.search).get('k') || '';
const TARGET_MIN = 10, HARD_MAX_MIN = 15;
const START = '(엄마가 대화를 시작했습니다. 따뜻하게 인사하고, 오늘의 주제로 먼저 이야기를 시작해주세요.)';

const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let history = [], sid = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
let t0 = 0, running = false, busy = false, rec = null, silentCount = 0, timer = null, ended = false;

async function api(body) {
  // text/plain 으로 보내 CORS 사전요청(preflight)을 피함
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ k: KEY, sid, ...body }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
const elapsed = () => t0 ? (Date.now() - t0) / 60000 : 0;
const setStatus = s => $('status').textContent = s;

// ---- 오늘의 주제 ----
fetch(API + '?k=' + encodeURIComponent(KEY)).then(r => r.json()).then(j => {
  $('topic').textContent = j.error ? '링크를 다시 확인해주세요' : '오늘의 주제: ' + j.title;
}).catch(() => $('topic').textContent = '');

// ---- 말하기(TTS) ----
// 1순위: 서버가 만들어준 자연스러운 AI 음성(오디오)을 재생
// 2순위(실패 시): 브라우저 자체 음성으로 대체
let audioCtx = null;
function playAiAudio(base64) {
  return new Promise((resolve, reject) => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const raw = atob(base64);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      const samples = new Int16Array(bytes.buffer);
      const buffer = audioCtx.createBuffer(1, samples.length, 24000); // 24kHz, 모노
      const ch = buffer.getChannelData(0);
      for (let i = 0; i < samples.length; i++) ch[i] = samples[i] / 32768;
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      src.onended = resolve;
      audioCtx.resume().then(() => src.start()).catch(reject);
    } catch (e) { reject(e); }
  });
}
function speakBrowser(text) {
  return new Promise(res => {
    const synth = window.speechSynthesis;
    synth.cancel();
    const parts = text.match(/[^.!?。？！]+[.!?。？！]?/g) || [text];
    // 한국어 음성 중, 로봇음처럼 들리는 로컬(기기 내장) 음성보다
    // 더 자연스러운 네트워크(구글 서버) 음성을 우선 선택
    const koVoices = synth.getVoices().filter(v => v.lang && v.lang.replace('_', '-').startsWith('ko'));
    const voice = koVoices.find(v => v.localService === false) || koVoices[0];
    let i = 0;
    const next = () => {
      if (i >= parts.length) return res();
      const u = new SpeechSynthesisUtterance(parts[i++].trim());
      u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.02; if (voice) u.voice = voice;
      u.onend = next; u.onerror = next;
      synth.speak(u);
    };
    next();
  });
}
async function speak(text, audioB64) {
  if (audioB64) {
    try { await playAiAudio(audioB64); return; } catch (e) { /* 아래로 내려가 브라우저 음성으로 대체 */ }
  }
  return speakBrowser(text);
}

// ---- 듣기(STT) ----
function listen() {
  if (!running || busy || ended) return;
  if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않아요. 크롬으로 열어주세요.'); return; }
  rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { setStatus('🎤 듣고 있어요. 말씀하세요'); $('main').className = 'listening'; $('main').textContent = '🎤 듣는 중…'; };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $('me').textContent = finalText + interim;
  };
  rec.onerror = e => { if (e.error === 'not-allowed') { running = false; setStatus('마이크 사용을 허용해주세요.'); } };
  rec.onend = () => {
    $('main').className = '';
    if (!running) return;
    if (finalText.trim()) { silentCount = 0; turn(finalText.trim()); }
    else if (++silentCount >= 3) { pause(); }
    else setTimeout(listen, 300);
  };
  try { rec.start(); } catch (_) {}
}
function pause() {
  running = false; try { rec && rec.abort(); } catch (_) {}
  setStatus('편하실 때 아래 버튼을 눌러 다시 이야기해요.');
  $('main').className = ''; $('main').textContent = '🎤 이야기하기';
}

// ---- 한 턴 진행 ----
async function turn(userText) {
  busy = true;
  try {
    if (userText) history.push({ role: 'user', text: userText });
    $('main').disabled = true; setStatus('생각하는 중이에요…');
    const j = await api({ action: 'chat', messages: history, elapsedMin: elapsed() });
    history.push({ role: 'model', text: j.reply });
    $('bubble').textContent = j.reply; $('me').textContent = '';
    setStatus('🔊 말씀드리는 중…');
    await speak(j.reply, j.audio);
  } catch (e) {
    const msg = '잠깐 문제가 생겼어요. 다시 한 번 말씀해 주시겠어요?';
    $('bubble').textContent = msg; await speak(msg);
    if (history.length && history[history.length - 1].role === 'user') history.pop();
  }
  busy = false; $('main').disabled = false;
  if (elapsed() >= HARD_MAX_MIN) return finish();
  if (running) listen();
}

// ---- 시작/종료 ----
$('main').onclick = () => {
  if (!t0) {               // 처음 시작
    t0 = Date.now(); running = true; $('end').hidden = false;
    history = [{ role: 'user', text: START }];
    timer = setInterval(() => { $('bar i').style.width = Math.min(100, elapsed() / TARGET_MIN * 100) + '%'; }, 1000);
    speechSynthesis.getVoices(); turn(null);
  } else if (!running && !ended) { running = true; silentCount = 0; listen(); }
};
$('end').onclick = finish;

async function finish() {
  if (ended) return; ended = true; running = false; try { rec && rec.abort(); } catch (_) {}
  clearInterval(timer); speechSynthesis.cancel();
  $('main').hidden = true; $('end').hidden = true; $('me').textContent = '';
  setStatus('');
  $('bubble').textContent = '오늘도 즐거웠어요. 내일 또 이야기해요! 🌸';
  try { await api({ action: 'end', messages: history, elapsedMin: elapsed() }); } catch (_) {}
}
// 탭을 닫아도 진행 기록은 남도록 (요약은 못 남음)
</script>
</body>
</html>
